id = "jeffhuen.tether-browser"
name = "Tether Browser"
version = "0.1.29"
min_herdr_version = "0.7.0"
description = "Remote-to-local browser automation bridge for AI coding agents. Intercepts terminal links to open directly inside Tether browser tab groups."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "open-tether"
title = "Open in Tether Browser"
contexts = ["workspace", "tab", "pane"]
command = ["bash", "scripts/herdr-open.sh"]

[[link_handlers]]
id = "tether-url"
title = "Open in Tether Browser"
pattern = "^https?://.+$"
action = "open-tether"
