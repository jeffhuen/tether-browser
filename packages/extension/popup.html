<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tether Browser Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </div>
        <span class="title">Tether</span>
        <a href="https://github.com/jeffhuen/tether-browser" target="_blank" rel="noopener noreferrer" class="version-link" title="View repository on GitHub">
          <svg class="gh-icon" width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <span id="ext-version" class="version">v0.1.21</span>
        </a>
      </div>
      <div class="header-actions">
        <button id="btn-reload-ext" class="btn-icon" title="Reload extension from disk (after git pull)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </button>
        <div id="status-badge" class="badge badge-disconnected" title="Native messaging bridge connection">
          <span class="dot"></span>
          <span id="status-text">Disconnected</span>
        </div>
      </div>
    </header>

    <!-- Quick Actions (FireShot Style) -->
    <section class="section">
      <div class="action-grid">
        <button id="btn-inspect" class="action-card action-primary" title="Click to inspect elements and pin review feedback on the page">
          <svg class="action-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="3"/>
            <line x1="12" y1="2" x2="12" y2="6"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="2" y1="12" x2="6" y2="12"/>
            <line x1="18" y1="12" x2="22" y2="12"/>
          </svg>
          <div class="action-label">Inspect & Pin Notes</div>
          <div class="action-desc">Click elements to add review notes</div>
        </button>

        <button id="btn-screenshot" class="action-card" title="Capture full desktop resolution screenshot">
          <svg class="action-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          <div class="action-label">Take Screenshot</div>
          <div class="action-desc">Save high-res PNG to disk</div>
        </button>
      </div>
    </section>

    <!-- Review Notes Section -->
    <section id="review-section" class="section">
      <div class="section-header">
        <span class="section-title">Review Notes <span class="scope-sep">|</span> <span class="scope-tab">Current Tab</span> <span id="notes-badge" class="count-chip">0</span></span>
        <div class="section-actions">
          <button id="btn-copy-notes" class="btn-pill" title="Copy formatted notes to clipboard">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span id="copy-text">Copy</span>
          </button>
          <button id="btn-clear-notes" class="btn-pill btn-pill-danger" title="Clear notes on active tab">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            <span>Clear</span>
          </button>
        </div>
      </div>
      <div id="notes-list" class="notes-container">
        <div class="empty-state">No pinned notes yet. Click <b>Inspect & Pin Notes</b> to review elements on this page.</div>
      </div>
    </section>

    <!-- Open Tabs Manager -->
    <section class="section">
      <div class="section-header">
        <span class="section-title">Open Tabs</span>
        <button id="btn-refresh-tabs" class="btn-icon" title="Refresh tabs">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </button>
      </div>
      <div id="tabs-list" class="tabs-container">
        <div class="loading-state">Loading tabs...</div>
      </div>
    </section>

    <!-- Quick Navigation -->
    <section class="section">
      <form id="nav-form" class="nav-form">
        <input type="text" id="nav-input" class="nav-input" placeholder="Enter URL Address..." autocomplete="off">
        <button type="submit" id="btn-nav-go" class="btn-nav" title="Open in active tab">Go</button>
        <button type="button" id="btn-nav-new" class="btn-nav btn-nav-secondary" title="Open in new tab in Tether group">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>New Tab</span>
        </button>
      </form>
    </section>

    <!-- Credits Footer -->
    <footer class="credits-footer">
      <div class="credits-left">
        <span class="credits-brand">Tether</span>
        <span class="credits-sep">•</span>
        <span class="credits-note">Zero-latency bridge</span>
      </div>
      <span class="credits-tag">AI Agent Runtime</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
